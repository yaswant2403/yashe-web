baseURL = 'https://yashe.me/'
locale = 'en-us'
title = 'Yash Ejjagiri'
theme = 'typo'

[services]
  [services.googleAnalytics]
    id = "G-JM14ZQQSWS"

[taxonomies]
tag = 'tags'

[params]
# Meta description
description = "A Personal Website"

# Appearance settings
theme = 'auto'
colorPalette = 'default'
hideHeader = false

# Intro on main page, content is markdown
homeIntroTitle = 'About Me'
homeIntroContent = """
I am Yash Ejjagiri, a SURA/CRESST II Research Assistant at NASA Goddard Space Flight Center (GSFC), where I develop neural-network emulators of pulse-profile models for NICER X-ray data to constrain neutron-star mass, radius, and magnetic field geometries.

Before GSFC, I spent three years in Professor Xin Liu's AstroAI group at the National Center for Supercomputing Applications (NCSA) at University of Illinois Urbana-Champaign (UIUC), developing [DeepDISC](https://github.com/grantmerz/deepdisc), a deep-learning framework for joint detection, deblending, classification, and photometric redshift estimation in next-generation surveys, with a focus on [combining Roman and Rubin LSST imaging](https://github.com/grantmerz/DeepDISC_Roman_Rubin/). 

I am also a research contributor in EleutherAI's Summer of Open AI Research, testing whether astronomy foundation models encode physical galaxy properties.

In May 2025, I graduated from UIUC with a B.S. in Computer Science + Astronomy, with minors in Physics and Mathematics.

I am broadly interested in applying machine learning to large-scale astrophysical surveys, with a particular interest in field-level inference, simulation-based inference, and multi-scale emulators for cosmology.

Here is my [CV](/cv.pdf), and feel free to check out my [presentations and talks](/talks).
"""

# Collection to display on home
homeSections = ['talks', 'posts']  # order shown on home page
homeListSize = 3                   # newest N per section, then an "all …" link

# Lists parameters
paginationSize = 10
listSummaries = true
listDateFormat = '2 Jan 2006'

# Breadcrumbs
[params.breadcrumbs]
enabled = true
showCurrentPage = true
home = "Home"

# Social icons
[[params.social]]
name = "linkedin"
url = "https://linkedin.com/in/yaswant-ejjagiri"

[[params.social]]
name = "github"
url = "https://github.com/yaswant2403"

# Main menu pages
[[params.menu]]
name = "home"
url = "/"

[[params.menu]]
name = "cv"
url = "/cv.pdf"

[[params.menu]]
name = "talks"
url = "/talks"

[[params.menu]]
name = "posts"
url = "/posts"

[[params.menu]]
